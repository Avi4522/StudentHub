<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StudentHub Portal — Low-Fidelity Wireframes</title>
<style>
  :root{--line:#8a8a8a;--bg:#f4f4f4;--box:#ffffff;--text:#333;}
  *{box-sizing:border-box;}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:0;}
  header{background:#222;color:#fff;padding:14px 20px;}
  header h1{margin:0;font-size:18px;}
  header p{margin:4px 0 0;font-size:12px;color:#bbb;}
  nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;background:#ddd;border-bottom:2px dashed var(--line);}
  nav button{background:#fff;border:1px solid var(--line);padding:6px 10px;font-size:12px;cursor:pointer;border-radius:3px;}
  nav button.active{background:#333;color:#fff;}
  .screen{display:none;padding:20px;max-width:960px;margin:0 auto;}
  .screen.active{display:block;}
  .frame{border:2px solid var(--line);background:var(--box);padding:16px;position:relative;}
  .frame::before{content:attr(data-label);position:absolute;top:-11px;left:10px;background:var(--bg);padding:0 6px;font-size:11px;color:#555;font-weight:bold;}
  .box{border:1.5px dashed var(--line);padding:10px;margin:8px 0;font-size:12px;color:#555;text-align:center;}
  .row{display:flex;gap:8px;}
  .row > .box{flex:1;}
  .logo{width:70px;height:24px;border:1.5px solid var(--line);text-align:center;font-size:10px;line-height:24px;}
  .navbar{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--line);padding:8px;margin-bottom:10px;font-size:11px;}
  .navlinks{display:flex;gap:10px;}
  .navlinks span{border:1px solid var(--line);padding:3px 6px;}
  .sidebar{border:1.5px dashed var(--line);padding:8px;font-size:11px;width:140px;}
  .sidebar div{border:1px solid var(--line);margin:4px 0;padding:5px;text-align:center;}
  .content-area{flex:1;padding:0 10px;}
  .card{border:1px solid var(--line);padding:8px;font-size:11px;margin:6px 0;}
  .btn{display:inline-block;border:1.5px solid #333;padding:5px 12px;font-size:11px;background:#eee;}
  table.wf{width:100%;border-collapse:collapse;font-size:11px;}
  table.wf td, table.wf th{border:1px solid var(--line);padding:6px;text-align:left;}
  .placeholder-img{border:1.5px dashed var(--line);height:60px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#888;}
</style>
</head>
<body>

<header>
  <h1>StudentHub Portal — Low-Fidelity Wireframes</h1>
  <p>Grayscale, box-level layout sketches. Click a page name below to preview.</p>
</header>

<nav id="nav"></nav>

<!-- ============ SCREENS ============ -->
<div id="screens"></div>

<script>
const pages = [
  "Landing","Login","Register","Student Dashboard","Faculty Dashboard",
  "Admin Dashboard","Course Catalog","Course Detail","Attendance","Grades",
  "Assignments","Timetable","Announcements","Fees","Profile"
];

const nav = document.getElementById('nav');
const screensWrap = document.getElementById('screens');

pages.forEach((p,i)=>{
  const btn = document.createElement('button');
  btn.textContent = p;
  btn.onclick = ()=>show(i);
  nav.appendChild(btn);
});

function show(i){
  document.querySelectorAll('nav button').forEach((b,idx)=>b.classList.toggle('active', idx===i));
  document.querySelectorAll('.screen').forEach((s,idx)=>s.classList.toggle('active', idx===i));
}

const templates = {
"Landing": `

"Fees": `

"Profile": `

    <div class="content-area">

  </div>

};

pages.forEach((p,i)=>{
  const div = document.createElement('div');
  div.className = 'screen';
  div.innerHTML = templates[p] || `<div class="frame" data-label="${p}">Wireframe placeholder</div>`;
  screensWrap.appendChild(div);
});

show(0);
</script>
</body>
</html>
