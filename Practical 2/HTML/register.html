<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub | Register</title>

    <link rel="stylesheet" href="../css/register.css">

</head>
<body>

    <div class="container">
        <div class="form-box">
            <header class="header">
                <div class="logo">
                    <img src="../images/logo (2).png" alt="Logo">
                </div>
                <h1>StudentHub Portal</h1>
                <div class="spacer"></div>
            </header>

            <h2>Create Account</h2>
            <p>Join StudentHub</p>
            <br><br>
                <form class="form" id="registerForm">
                    <label for="fullname" class="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                    <br><br>

                    <label for="email" class="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                    <br><br>

                    <label for="username" class="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                    <br><br>

                    <label for="role" class="role">Role:</label>
                    <select type="id" id="role" name="role" required>
                        <option value="">Select Role</option>
                        <option value="admin">Admin</option>
                        <option value="faculty">Faculty</option>
                        <option value="student">Student</option>  
                    </select>
                    <br><br>

                    <label for="password" class="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                    <br><br>

                    <label for="confirm-password" class="confirm-password">Confirm Password:</label>
                    <input type="password" id="confirm-password" name="confirm-password" required>
                    <br><br>

                    <p>Already have an account? <a href="./login.html">login here</a></p>
                    <br>

                    <button type="submit" class="button">Register</button>
                </form>    
        </div>
    </div>

    <script src="../js/register.js"></script>
</body>
</html>
